<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BallBreakers Tournament</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🏐 BallBreakers Tournament Manager</h1>
  </header>

  <main class="container">

    <!-- AGREGAR EQUIPOS -->
    <section class="card">

      <h2>Registrar Equipos</h2>

      <div class="form-group">
        <input
          type="text"
          id="equipoInput"
          placeholder="Nombre del equipo"
        >

        <button onclick="agregarEquipo()">
          Agregar
        </button>
      </div>

    </section>

    <!-- LISTA DE EQUIPOS -->
    <section class="card">

      <h2>Equipos Inscritos</h2>

      <ul id="listaEquipos"></ul>

    </section>

    <!-- GENERAR GRUPOS -->
    <section class="card">

      <h2>Fase de Grupos</h2>

      <button onclick="generarGrupos()">
        Generar Grupos
      </button>

      <div id="gruposContainer"></div>

      <h2 style="margin-top:30px;">
  Fixture
</h2>

<div id="fixtureContainer"></div>

<h2 style="margin-top:30px;">
  Tabla de Posiciones
</h2>

<div id="tablaContainer"></div>
    </section>

  </main>

  <script src="app.js"></script>

</body>
</html>
